  "description": "В этой статье показано, как интернет-мошенники создают фейковые сайты банков и поддельные инвестиционные платформы, которые выглядят убедительнее, чем многие настоящие сайты. Как распознать мошеннический сайт по тонким признакам архитектуры обмана и как проверить сайт на мошенничество перед тем, как ввести пароль или номер карты.\n\nСегодня онлайн-мошенничество стало искусством. Забудьте про кривые сайты с Comic Sans.  Современные фишинговые сайты создают профессиональные дизайнеры. Спуфинг (подмена сайта) доводит копирование до пиксельного совершенства. Ошибки есть, но они незаметны и вводят в заблуждение даже опытных пользователей.",

  "articleBody": "<h1><span style=\"color: rgb(240, 102, 102);\">Как мошенники создают фейковые сайты банков и сервисов</span></h1><p><br></p><p>Если говорить прямо, <strong>фейковый сайт</strong> - это не кривой лендинг из начала 2000-х. Это аккуратно собранный интернет-ресурс, задача которого - выглядеть «как надо» и вызвать доверие ровно на то время, которое нужно, чтобы вы ввели данные карты или логин от аккаунта.</p><p><br></p><p><span style=\"color: rgb(250, 204, 204);\">В 2025 году фишинговые атаки вышли на новый уровень: количество зарегистрированных инцидентов достигло исторического максимума (1,13 млн атак за Q2 по данным APWG), а визуальное качество поддельных сайтов сравнялось с официальными банковскими платформами.&nbsp;Мошенники массово используют AI-генерацию дизайна, текстов и отзывов, из-за чего даже опытные пользователи всё чаще попадаются на&nbsp;архитектурные ловушки.</span></p><p><br></p><p><strong style=\"color: rgb(240, 102, 102);\">Архитектура обмана<strong style=\"color: rgb(255, 255, 255);\"> </strong><span style=\"color: rgb(255, 255, 255);\">—  это набор визуальных, технических и психологических приёмов. Всё работает вместе: дизайн, тексты, кнопки, уведомления и даже цвет шрифта. Цель одна — создать ощущение, что вы «дома», на привычном официальном сайте.</span></strong></p><p><br></p><p><strong>Первое, на чём чаще всего ловят пользователей, это - </strong><span style=\"color: rgb(240, 102, 102); font-weight: bold; display: inline !important;\">подмена домена</span><strong>.</strong></p><p><br></p><p> Вместо&nbsp;<code style=\"background-color: oklch(0.6898 0.027 109.55 / 0.16);\">sberbank.ru</code>&nbsp;вас аккуратно приводят на:</p><p><br></p><ul><li><code style=\"background-color: oklch(0.6898 0.027 109.55 / 0.16);\">sberbank-secure.ru</code></li><li><code style=\"background-color: oklch(0.6898 0.027 109.55 / 0.16);\">sberbank-login.com</code></li><li><code style=\"background-color: oklch(0.6898 0.027 109.55 / 0.16);\">sberbаnk.ru</code>&nbsp;(где буква «а» — кириллическая!)</li></ul><p><br></p><p><em>На глаз почти одно и то же. На деле — совсем другой сайт.</em></p><p><br></p><p>Отдельная история — <strong style=\"color: rgb(240, 102, 102); display: inline !important;\">punycode-домены</strong>. Они позволяют маскировать кириллицу под латиницу. В браузере всё выглядит прилично, а технически адрес превращается в набор символов врод<span style=\"background-color: rgb(0, 0, 0);\">е </span><span style=\"background-color: rgb(0, 0, 0); color: rgb(240, 102, 102); font-size: 11.05px; display: inline !important;\">xn--b1asb0a.xn--p1ai.</span> Пользователь этого, конечно, не видит — и в этом вся проблема.</p><p><br></p><h3><span style=\"color: rgb(68, 68, 68);\">Почему всё это работает?</span></h3><p><em style=\"color: rgb(187, 187, 187);\">Потому что наш мозг любит shortcuts.</em></p><p><em style=\"color: rgb(187, 187, 187);\">Мы привыкли, что если сайт выглядит как банк, если есть зелёный замок в адресной строке, если дизайн знакомый, значит, всё в порядке. </em></p><p><em style=\"color: rgb(187, 187, 187);\">Психологи давно это описали. Роберт Чалдини ещё в 80-х писал, что люди склонны доверять символам авторитета автоматически. Без лишних вопросов. Банковский логотип, привычные цвета, аккуратный интерфейс — всё это для мозга сигнал: «здесь безопасно».</em></p><p><em style=\"color: rgb(187, 187, 187);\">Проблема в том, что мозг экономит энергию. Он не хочет каждый раз всё перепроверять. А мошенники это отлично понимают — и строят свои сайты именно на этом. Им не нужно убеждать вас долго. Достаточно создать правильное ощущение «официальности» — и вы сами сделаете всё остальное.</em></p><p><em style=\"color: rgb(187, 187, 187);\">Именно поэтому фишинговые сайты сегодня выглядят так убедительно. Они играют не на технологиях, а на привычках.</em></p><h2><br></h2><h2>игра на страхе и срочности </h2><p><br></p><p>Манипуляция начинается ещё до загрузки сайта — на этапе ссылки или сообщения:</p><p><br></p><blockquote><em style=\"background-color: rgb(235, 214, 255); color: rgb(61, 20, 102);\">«Срочно подтвердите данные карты»</em></blockquote><blockquote><em style=\"background-color: rgb(235, 214, 255); color: rgb(61, 20, 102);\"> «Ваш счёт будет заблокирован»</em></blockquote><blockquote><em style=\"background-color: rgb(235, 214, 255); color: rgb(61, 20, 102);\"> «Подозрительная операция, войдите в аккаунт»</em></blockquote><p>Это классическая <u>социальная инженерия</u>. Мошенники давят на страх, создают ощущение срочности и не оставляют времени на проверку. В таком состоянии человек действует автоматически и именно этого от него ждут.</p><p><br></p><h3><span style=\"background-color: transparent; color: rgb(68, 68, 68);\">Почему срочность отключает мозг? (Kahneman \"Thinking, Fast and Slow\")</span></h3><p><em style=\"background-color: transparent; color: rgb(187, 187, 187);\">\"Срочно!\" активирует Систему 1 (быстрое мышление) — инстинкты, эмоции, автопилот. Система 2 (анализ, проверки) отключается. Нобелевский лауреат Даниэль Канеман доказал: под давле...",
