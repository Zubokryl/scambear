  "articleBody": "<p>Пятница, 17:15.</p><p><br></p><p>Рабочая неделя закончилась, по крайней мере, формально. Мозг кипит, внимание распадается на фрагменты, почта мигает красным: «СРОЧНО! Подтвердите 2FA или доступ будет заблокирован».</p><p>Рука тянется к мышке.</p><p>Если вы думаете, что в этот момент вы просто устали, то это не совсем так.</p><p><br></p><h2><span style=\"color: rgb(240, 102, 102);\">Миф об истощении силы воли</span></h2><p>Долгое время объяснение было простым: к концу недели самоконтроль «истощается», как батарейка. Идея эта принадлежит Рою Баумейстеру — американскому психологу и профессору Университета Квинсленда, мировому эксперту по самоконтролю. Он написал сотни статей и несколько бестселлеров, включая «Willpower», и десятилетиями считался номером один в своей области.</p><p>Баумейстер придумал знаменитый эксперимент <em>«Печенье против редьки»</em>. Участникам предлагали съесть вкусное печенье или несъедобную редьку, а потом решить сложную головоломку. Те, кто сдерживался и ел редьку, сдавались почти в 2,5 раза быстрее. Баумейстер сделал вывод, что самоконтроль действительно расходуется. Эксперимент был прост, нагляден и объяснял, почему мы устаём от постоянных решений — от диеты до работы. Звучало логично.</p><p><br></p><h3><span style=\"color: rgb(240, 102, 102);\"> 2016: когда наука взорвала собственную теорию</span></h3><p>В 2016 году масштабное исследование Hagger et al. с 2141 участником и 23 лабораториями показало: классического истощения силы воли практически не существует. Скорость и точность когнитивных тестов не падали — мозг продолжал работать.</p><p>Но был один парадокс: участники чувствовали себя выжатыми. Субъективная усталость была в 10–20 раз сильнее реальной. И именно она оказалась ключом.</p><p><br></p><p><span style=\"color: rgb(250, 204, 204);\">Не истощение, а переключение режимов мышления.</span></p><p>Баумейстер не был полностью неправ — просто описывал другой механизм. Когда человек ощущает усталость, включается System 1 по Канеману: решения становятся быстрыми, автоматическими. Критическое мышление не выключается, оно просто обходится.</p><p>Вы не становитесь глупее. Вы просто меньше проверяете свои действия.</p><p><br></p><h3><span style=\"color: rgb(240, 102, 102);\">🕓 пятница после 16:00 — идеальное время для мошенников</span></h3><p>APWG Q3 2025 зафиксировал 892 494 фишинговых атаки за квартал. Пик приходится на конец недели.</p><p>После 16:00 в пятницу сходятся сразу несколько факторов: субъективная фрустрация, дробление внимания между почтой, мессенджерами и уведомлениями, цепочка мелких решений и временное давление «сейчас или никогда». Это не усталость мозга, а усталость от необходимости думать.</p><p><br></p><h3><span style=\"color: rgb(240, 102, 102);\"> идеальное оружие социальной инженерии</span></h3><p>Фишинг не атакует интеллект. Он атакует ощущение перегруженности. Фразы вроде «СРОЧНО», «Последний шанс», «Истекает через 60 минут» действуют потому, что <u>вы не хотите ещё одного решения, а не потому, что не понимаете риск</u>.</p><p>Жертвы — не наивные люди. Это перегруженные профессионалы: менеджеры, руководители, специалисты с сотней мелких решений за день. К пятнице мозг всё ещё способен анализировать, но чувство «я больше не могу» отключает проверку.</p><p><br></p><h3><u>Защита, которая противоречит популярным советам</u></h3><p><br></p><p>❌ Кофе не спасает</p><p>❌ Перерыв не решает проблему</p><p>❌ «Соберись» тоже не работает</p><p><br></p><h3><span style=\"color: rgb(250, 204, 204);\">Что надо сделать</span></h3><p><br></p><p>✅ Подумать 10 секунд перед кликом</p><p>✅ Задать себе вопрос: «Сейчас пятница после 16:00?»</p><p>✅ Все важные решения принимать с утра</p><p><br></p><p><strong style=\"background-color: rgb(0, 0, 0); color: rgb(240, 102, 102);\">Итог:</strong>мозг работает, но чувство выжатости толкает к импульсивности. Именно на это нацелены 892 тысячи атак APWG 2025. Фишинг бьёт не по слабым, а по уставшим.</p><p>&nbsp;</p><p><strong><em><u>Источники:</u></em></strong></p><p>Hagger et al., <em>Perspectives on Psychological Science</em>, 2016 (23 лаборатории, N=2141)</p><p>APWG Phishing Activity Trends Report Q3 2025</p>...",
